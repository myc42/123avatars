<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar : crée et télécharge en SVG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#000;--muted:#6a6a68;--track:#f0efec;--stage:#f5f4f2;--tile:#fff;--tile-line:#e3e1dc;--focus:#2457ff;--btn:#000;--btn-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;letter-spacing:-.02em;font-weight:700}
.sub{margin:0 0 16px;color:var(--muted);font-size:15px;max-width:40ch}
.stage{position:relative;aspect-ratio:1;background:var(--stage);border-radius:28px;overflow:hidden}
.stage>svg{display:block;width:100%;height:100%}
.shuffle{position:absolute;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center}
.shuffle svg{width:24px;height:24px;fill:none;stroke:#000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600}
.btn.main{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
#msg{min-height:22px;margin:8px 2px 0;font-size:14px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--track);border-radius:26px}
.tab{border:0;background:transparent;border-radius:999px;padding:11px 6px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{background:var(--tile);color:#000;box-shadow:0 0 0 1.5px var(--tile-line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{aspect-ratio:1;background:var(--tile);border:1.5px solid var(--tile-line);border-radius:20px;padding:8px;display:grid;place-items:center}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.tile svg{width:100%;height:100%;display:block}
@media (min-width:820px){
.app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start;padding-top:44px}
.left{position:sticky;top:24px}
}
</style>
</head>
<body>
<main class="app">
  <section class="left">
    <h1>Avatar</h1>
    <p class="sub">Choisis les cheveux, la barbe, le haut et les lunettes, puis télécharge ton SVG.</p>
    <div class="stage" id="stage" role="img" aria-label="Aperçu de l’avatar"></div>
    <div class="actions">
      <button class="btn main" id="dlSvg">Télécharger SVG</button>
      <button class="btn" id="dlPng">Télécharger PNG</button>
      <button class="btn" id="copy">Copier le SVG</button>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>
  <section class="right">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-t="hair">Cheveux</button>
      <button class="tab" role="tab" data-t="beard">Barbe</button>
      <button class="tab" role="tab" data-t="top">Vêtements</button>
      <button class="tab" role="tab" data-t="glasses">Lunettes</button>
    </div>
    <div class="grid" id="grid" role="tabpanel"></div>
  </section>
</main>

let tab='hair',dl=null,timer=0;
const $=id=>document.getElementById(id);

function thumb(i){
  if(tab==='top')return svg(TOPS[i][1],'36 222 332 200');
  if(i===0&&(tab==='glasses'||tab==='beard'))return NONE;
  if(tab==='glasses')return svg(glassG(i),'150 77 132 100');
  const s=Object.assign({},state,{[tab]:i});
  return svg(neckG(s)+headG(s),tab==='hair'?'56 8 290 300':'100 40 200 200');
}
function renderStage(){$('stage').innerHTML=svg(full(state),'0 0 400 400')+
  '<button class="shuffle" id="shuffle" aria-label="Mélanger au hasard"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4"/></svg></button>';}
function renderTabs(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));}
function renderGrid(){
  const items={hair:HAIR,beard:BEARDS,top:TOPS,glasses:GLASSES}[tab];
  $('grid').innerHTML=items.map((it,i)=>'<button class="tile" data-i="'+i+'" aria-label="'+it[0]+'" aria-pressed="'+(state[tab]===i)+'">'+thumb(i)+'</button>').join('');
}
function renderAll(){renderStage();renderTabs();renderGrid();}

function toast(t){const m=$('msg');m.textContent=t;clearTimeout(timer);timer=setTimeout(()=>{m.textContent=''},2800);}

async function save(filename,data,okMsg){
  if(dl){
    try{await dl.save({filename,data});toast(okMsg);}
    catch(e){if(!(e&&e.code==='declined'))toast('Téléchargement impossible ici.');}
    return;
  }
  try{
    const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);toast(okMsg);
  }catch(e){toast('Téléchargement impossible ici.');}
}
function toPng(){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=1200;c.getContext('2d').drawImage(img,0,0,1200,1200);c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png');};
    img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(exportSvg());
  });
}
async function copySvg(){
  const t=exportSvg();
  try{await navigator.clipboard.writeText(t);toast('SVG copié.');return;}catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();
    toast(ok?'SVG copié.':'Copie impossible ici.');
  }catch(e){toast('Copie impossible ici.');}
}

$('dlSvg').addEventListener('click',()=>save('avatar.svg',exportSvg(),'SVG enregistré.'));
$('dlPng').addEventListener('click',async()=>{try{save('avatar.png',await toPng(),'PNG enregistré.');}catch(e){toast('Export PNG impossible ici.');}});
$('copy').addEventListener('click',copySvg);
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.t;renderTabs();renderGrid();});
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('.tile');if(!b)return;
  const i=+b.dataset.i;state[tab]=i;renderStage();renderGrid();
  const n=$('grid').children[i];if(n)n.focus({preventScroll:true});
});
$('stage').addEventListener('click',e=>{
  if(!e.target.closest('#shuffle'))return;
  state.hair=Math.floor(Math.random()*HAIR.length);
  state.beard=Math.floor(Math.random()*BEARDS.length);
  state.top=Math.floor(Math.random()*TOPS.length);
  state.glasses=Math.floor(Math.random()*GLASSES.length);
  renderAll();$('shuffle').focus({preventScroll:true});
});

renderAll();
(async()=>{try{if(window.claude&&claude.use)dl=await claude.use('downloads');}catch(e){}})();
</script>
</body>
</html>
